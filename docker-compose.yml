services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gasscope
      POSTGRES_PASSWORD: gasscope
      POSTGRES_DB: gasscope
    ports:
      - "5432:5432"
    volumes:
      - gasscope-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gasscope -d gasscope"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      target: api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://gasscope:gasscope@postgres:5432/gasscope
      DATA_MODE: postgres
      API_HOST: 0.0.0.0
      API_PORT: 4000
      CORS_ORIGINS: http://localhost:3000
      ALLOW_INSECURE_MUTATIONS: "true"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://gasscope:gasscope@postgres:5432/gasscope
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      target: web
    environment:
      API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  gasscope-pg:
